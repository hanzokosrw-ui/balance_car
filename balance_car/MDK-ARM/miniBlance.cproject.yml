project:
  packs:
    - pack: ARM::CMSIS@^6.3.0
    - pack: Keil::STM32F1xx_DFP@^2.4.1
    - pack: ARM::CMSIS-NN@^4.0.0
    - pack: ARM::CMSIS-DSP@^1.10.1
  setups:
    - setup: Options for miniBlance
      add-path:
        - ../Inc
        - ../Drivers/STM32F1xx_HAL_Driver/Inc
        - ../Drivers/STM32F1xx_HAL_Driver/Inc/Legacy
        - ../Drivers/CMSIS/Device/ST/STM32F1xx/Include
        - ../Drivers/CMSIS/Include
        - ../MiniBalance_HARDWARE/beep
        - ../MiniBalance_HARDWARE/DataScope_DP
        - ../MiniBalance_HARDWARE/DMP
        - ../SYSTEM/delay
        - ../MiniBalance_HARDWARE/ENCODER
        - ../MiniBalance_HARDWARE/IIC
        - ../MiniBalance_HARDWARE/LED
        - ../MiniBalance_HARDWARE/KEY
        - ../MiniBalance_HARDWARE/Lidar
        - ../MiniBalance_HARDWARE/OLED
        - ../MiniBalance_HARDWARE/PSTWO
        - ../MiniBalance/CONTROL
        - ../MiniBalance_HARDWARE/USART3
        - ../MiniBalance/ELE_CCD
        - ../MiniBalance/filter
        - ../MiniBalance_HARDWARE/MPU6050
        - ../MiniBalance/show
        - ../MiniBalance_HARDWARE/Remote
      debug: "on"
      define:
        - USE_HAL_DRIVER
        - STM32F103xE
      misc:
        - C:
            - -std=c99
          C-CPP:
            - -fno-rtti
            - -funsigned-char
            - -fshort-enums
            - -fshort-wchar
            - -ffunction-sections
            - -Wno-packed
            - -Wno-missing-variable-declarations
            - -Wno-missing-prototypes
            - -Wno-missing-noreturn
            - -Wno-sign-conversion
            - -Wno-nonportable-include-path
            - -Wno-reserved-id-macro
            - -Wno-unused-macros
            - -Wno-documentation-unknown-command
            - -Wno-documentation
            - -Wno-license-management
            - -Wno-parentheses-equality
            - -Wno-pointer-sign
          CPP:
            - -xc++
            - -std=c++11
            - -fno-exceptions
          ASM:
            - -masm=auto
          Link:
            - --map
            - --load_addr_map_info
            - --xref
            - --callgraph
            - --symbols
            - --info sizes
            - --info totals
            - --info unused
            - --info veneers
            - --strict
            - --summary_stderr
            - --info summarysizes
  linker:
    - script: miniBlance_miniBlance.sct
  groups:
    - group: Application/MDK-ARM
      files:
        - file: startup_stm32f103xe.s
    - group: Application/User
      files:
        - file: ../Src/main.c
        - file: ../Src/gpio.c
        - file: ../Src/adc.c
        - file: ../Src/tim.c
        - file: ../Src/usart.c
        - file: ../Src/stm32f1xx_it.c
        - file: ../Src/stm32f1xx_hal_msp.c
    - group: Drivers/CMSIS
      files:
        - file: ../Src/system_stm32f1xx.c
    - group: HAREWARE
      files:
        - file: ../MiniBalance_HARDWARE/beep/beep.c
        - file: ../MiniBalance_HARDWARE/ENCODER/encoder.c
        - file: ../MiniBalance_HARDWARE/IIC/IOI2C.c
        - file: ../MiniBalance_HARDWARE/KEY/key.c
        - file: ../MiniBalance_HARDWARE/LED/LED.c
        - file: ../MiniBalance_HARDWARE/Lidar/Lidar.c
        - file: ../MiniBalance_HARDWARE/OLED/oled.c
        - file: ../MiniBalance_HARDWARE/PSTWO/pstwo.c
        - file: ../MiniBalance_HARDWARE/USART3/usart3.c
        - file: ../MiniBalance_HARDWARE/Remote/capture.c
    - group: SYSTEM
      files:
        - file: ../SYSTEM/delay/delay.c
        - file: ../Src/sys.c
    - group: CONTORL
      files:
        - file: ../MiniBalance/CONTROL/control.c
        - file: ../MiniBalance/ELE_CCD/ELE_CCD.c
        - file: ../MiniBalance/MPU6050/MPU6050.c
        - file: ../MiniBalance/show/show.c
        - file: ../MiniBalance_HARDWARE/DMP/inv_mpu.c
        - file: ../MiniBalance/filter/filter.c
        - file: ../MiniBalance_HARDWARE/DataScope_DP/DataScope_DP.c
        - file: ../MiniBalance_HARDWARE/DMP/inv_mpu_dmp_motion_driver.c
    - group: Drivers/STM32F1xx_HAL_Driver
      misc:
        - C-CPP:
            - -Wno-packed
            - -Wno-missing-variable-declarations
            - -Wno-missing-prototypes
            - -Wno-missing-noreturn
            - -Wno-sign-conversion
            - -Wno-nonportable-include-path
            - -Wno-reserved-id-macro
            - -Wno-unused-macros
            - -Wno-documentation-unknown-command
            - -Wno-documentation
            - -Wno-license-management
            - -Wno-parentheses-equality
            - -Wno-covered-switch-default
            - -Wno-unreachable-code-break
          CPP:
            - -xc++
            - -fno-exceptions
      files:
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_gpio_ex.c
          misc:
            - CPP:
                - -xc++
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_adc.c
          misc:
            - CPP:
                - -xc++
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_adc_ex.c
          misc:
            - CPP:
                - -xc++
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal.c
          misc:
            - CPP:
                - -xc++
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_rcc.c
          misc:
            - CPP:
                - -xc++
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_rcc_ex.c
          misc:
            - CPP:
                - -xc++
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_gpio.c
          misc:
            - CPP:
                - -xc++
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_dma.c
          misc:
            - CPP:
                - -xc++
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_cortex.c
          misc:
            - CPP:
                - -xc++
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_pwr.c
          misc:
            - CPP:
                - -xc++
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_flash.c
          misc:
            - CPP:
                - -xc++
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_flash_ex.c
          misc:
            - CPP:
                - -xc++
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_exti.c
          misc:
            - CPP:
                - -xc++
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_tim.c
          misc:
            - CPP:
                - -xc++
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_tim_ex.c
          misc:
            - CPP:
                - -xc++
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_uart.c
          misc:
            - CPP:
                - -xc++
  components:
    - component: ARM::CMSIS:CORE
